<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#10151d">
    <title>NEON BREAKER｜立體打磚塊</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            color-scheme: dark;
            --ink: #11161c;
            --paper: #f5f4eb;
            --muted: #a9b0ad;
            --lime: #d7ff4f;
            --cyan: #48f1dc;
            --pink: #ff5a89;
            --orange: #ffad45;
            --line: #ffffff24;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: clamp(14px, 3vw, 34px);
            color: var(--paper);
            font-family: "Noto Sans TC", sans-serif;
            background: radial-gradient(ellipse at 50% 5%, #29352b 0, #171e1d 38%, #10151d 80%);
        }
        button { font: inherit; }
        .arcade { width: min(1120px, 100%); margin: 0 auto; }
        .topline { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 20px; }
        .brand { display: flex; align-items: center; gap: 13px; }
        .mark { width: 38px; height: 38px; display: grid; place-items: center; color: var(--ink); background: var(--lime); clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); font-size: 23px; }
        .brand-copy { line-height: 1; }
        .brand-copy strong { display: block; font: 900 23px/1 "Barlow Condensed", sans-serif; letter-spacing: .03em; }
        .brand-copy span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; letter-spacing: .16em; }
        .top-actions { display: flex; align-items: center; gap: 9px; }
        .icon-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 8px; color: var(--paper); background: #ffffff0b; cursor: pointer; transition: background .18s, border-color .18s; }
        .icon-button:hover { background: #ffffff1c; border-color: #ffffff60; }
        .icon-button svg { width: 19px; height: 19px; }
        .eyebrow { color: var(--lime); font: 700 12px "Barlow Condensed", sans-serif; letter-spacing: .18em; }
        .title-row { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 15px; }
        h1 { margin: 0; color: var(--paper); font: 900 clamp(38px, 7vw, 68px)/.86 "Barlow Condensed", sans-serif; letter-spacing: .015em; }
        h1 span { color: var(--lime); }
        .edition { color: #aeb7b1; font-size: 12px; text-align: right; line-height: 1.7; }
        .game-frame { position: relative; overflow: hidden; border: 1px solid #d7ff4f55; border-radius: 10px; background: #141d20; box-shadow: 0 22px 80px #0007, 0 0 30px #d7ff4f12; }
        .game-frame::before { position: absolute; z-index: 1; inset: 0; border: 1px solid #ffffff12; border-radius: inherit; content: ""; pointer-events: none; }
        #scene { display: block; width: 100%; aspect-ratio: 16 / 9; touch-action: none; }
        .hud { position: absolute; z-index: 2; top: 16px; left: 18px; right: 18px; display: flex; align-items: flex-start; justify-content: space-between; pointer-events: none; }
        .hud-group { display: flex; gap: clamp(14px, 3vw, 34px); }
        .stat { min-width: 56px; }
        .stat small { display: block; color: #c3cbc3; font: 700 10px "Barlow Condensed", sans-serif; letter-spacing: .15em; }
        .stat strong { display: block; margin-top: 3px; color: white; font: 800 22px/1 "Barlow Condensed", sans-serif; }
        #lives { color: var(--pink); letter-spacing: .08em; }
        .level-tag { padding: 7px 10px; border: 1px solid #d7ff4f55; border-radius: 5px; color: var(--lime); background: #11191dcc; font: 700 11px "Barlow Condensed", sans-serif; letter-spacing: .12em; }
        .overlay { position: absolute; z-index: 3; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: #10171bd9; backdrop-filter: blur(5px); }
        .overlay[hidden] { display: none; }
        .panel { max-width: 480px; animation: rise .45s both; }
        @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
        .panel-kicker { color: var(--cyan); font: 700 12px "Barlow Condensed", sans-serif; letter-spacing: .25em; }
        .panel h2 { margin: 8px 0; color: var(--paper); font: 900 clamp(35px, 7vw, 64px)/.95 "Barlow Condensed", sans-serif; }
        .panel h2 span { color: var(--lime); }
        .panel p { margin: 12px 0 20px; color: #c3cbc3; font-size: 13px; line-height: 1.8; }
        .play-button { min-width: 172px; padding: 12px 22px; border: 0; border-radius: 5px; color: #151b17; background: var(--lime); box-shadow: 0 5px 0 #8aa82d, 0 0 30px #d7ff4f34; font-weight: 900; cursor: pointer; transition: transform .15s, box-shadow .15s; }
        .play-button:hover { transform: translateY(-2px); box-shadow: 0 7px 0 #8aa82d, 0 0 35px #d7ff4f55; }
        .play-button:active { transform: translateY(3px); box-shadow: 0 2px 0 #8aa82d; }
        .bottomline { display: flex; justify-content: space-between; gap: 12px; margin-top: 13px; color: #aab2ad; font-size: 11px; }
        .bottomline strong { color: var(--paper); font-weight: 500; }
        .keys { display: flex; align-items: center; gap: 7px; }
        kbd { min-width: 23px; padding: 3px 6px; border: 1px solid #ffffff30; border-bottom-width: 2px; border-radius: 4px; color: #e9eee8; background: #ffffff0c; font: 11px "Barlow Condensed", sans-serif; text-align: center; }
        @media (max-width: 600px) {
            body { padding: 14px 12px; }
            .topline { margin-bottom: 17px; }
            .title-row { align-items: start; }
            .edition { font-size: 10px; }
            .hud { top: 10px; left: 11px; right: 11px; }
            .stat small { font-size: 8px; }
            .stat strong { font-size: 17px; }
            .level-tag { padding: 5px 7px; font-size: 9px; }
            .bottomline { flex-direction: column; }
            .panel p { margin: 8px 0 13px; font-size: 12px; }
            .play-button { min-width: 150px; padding: 10px 16px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
    </style>
</head>
<body>
    <main class="arcade">
        <header class="topline">
            <div class="brand"><div class="mark" aria-hidden="true">✦</div><div class="brand-copy"><strong>ARCADE / 07</strong><span>BITTER SWEET GAME LAB</span></div></div>
            <div class="top-actions">
                <button class="icon-button" id="sound" type="button" aria-label="關閉音效" title="音效開關">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/></svg>
                </button>
                <button class="icon-button" id="pause" type="button" aria-label="暫停遊戲" title="暫停 / 繼續">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
                </button>
            </div>
        </header>

        <div class="title-row">
            <div><div class="eyebrow">CLASSIC ARCADE · NEW DIMENSION</div><h1>NEON <span>BREAKER</span></h1></div>
            <div class="edition">打破所有方塊<br>讓光束留在場上</div>
        </div>

        <section class="game-frame" aria-label="立體打磚塊遊戲">
            <canvas id="scene" aria-label="使用左右方向鍵或拖曳移動球拍"></canvas>
            <div class="hud">
                <div class="hud-group">
                    <div class="stat"><small>SCORE</small><strong id="score">00000</strong></div>
                    <div class="stat"><small>BEST</small><strong id="best">00000</strong></div>
                    <div class="stat"><small>LIVES</small><strong id="lives">♥♥♥</strong></div>
                </div>
                <div class="level-tag">ROUND 01</div>
            </div>
            <div class="overlay" id="overlay">
                <div class="panel">
                    <div class="panel-kicker">READY PLAYER ONE?</div>
                    <h2 id="headline">BREAK<br><span>THE BRICKS</span></h2>
                    <p id="message">接住彈球，清空霓虹磚塊。<br>每一面反彈，都是一次新的得分機會。</p>
                    <button class="play-button" id="start" type="button">開始遊戲　↗</button>
                </div>
            </div>
        </section>
        <footer class="bottomline">
            <div class="keys"><strong>移動</strong><kbd>←</kbd><kbd>→</kbd><span>或</span><kbd>A</kbd><kbd>D</kbd><span>・手機拖曳球拍</span></div>
            <div>清除全部方塊，挑戰你的最高分</div>
        </footer>
    </main>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js';

        (() => {
            const canvas = document.querySelector('#scene');
            const overlay = document.querySelector('#overlay');
            const scoreEl = document.querySelector('#score');
            const bestEl = document.querySelector('#best');
            const livesEl = document.querySelector('#lives');
            const startButton = document.querySelector('#start');
            const pauseButton = document.querySelector('#pause');
            const soundButton = document.querySelector('#sound');
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#17201f');
            scene.fog = new THREE.Fog('#17201f', 19, 36);

            const camera = new THREE.PerspectiveCamera(42, 16 / 9, .1, 100);
            camera.position.set(0, 5.6, 20);
            camera.lookAt(0, 0, 0);
            const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.35;

            const ambient = new THREE.HemisphereLight('#ecffcf', '#273b46', 2.1);
            scene.add(ambient);
            const keyLight = new THREE.DirectionalLight('#fff5d4', 3.4);
            keyLight.position.set(-5, 8, 10);
            scene.add(keyLight);
            const cyanLight = new THREE.PointLight('#38e8ff', 18, 15);
            cyanLight.position.set(7, 1, 5);
            scene.add(cyanLight);
            const pinkLight = new THREE.PointLight('#ff417a', 15, 14);
            pinkLight.position.set(-7, 3, 3);
            scene.add(pinkLight);

            const boardWidth = 16;
            const boardHeight = 10;
            const board = new THREE.Mesh(
                new THREE.BoxGeometry(boardWidth, boardHeight, .55),
                new THREE.MeshStandardMaterial({ color: '#1a2928', roughness: .52, metalness: .18 })
            );
            board.position.z = -1.05;
            scene.add(board);

            const grid = new THREE.GridHelper(16, 16, '#75e8c4', '#4c8073');
            grid.rotation.x = Math.PI / 2;
            grid.position.set(0, 0, -.75);
            grid.material.transparent = true;
            grid.material.opacity = .14;
            scene.add(grid);

            const frameMaterial = new THREE.MeshStandardMaterial({ color: '#d7ff4f', emissive: '#79a51c', emissiveIntensity: .7, metalness: .4, roughness: .25 });
            const railGeometry = new THREE.BoxGeometry(.12, boardHeight + .15, .36);
            [-boardWidth / 2, boardWidth / 2].forEach(x => {
                const rail = new THREE.Mesh(railGeometry, frameMaterial);
                rail.position.set(x, 0, -.45);
                scene.add(rail);
            });
            const topRail = new THREE.Mesh(new THREE.BoxGeometry(boardWidth + .1, .12, .36), frameMaterial);
            topRail.position.set(0, boardHeight / 2, -.45);
            scene.add(topRail);

            const paddleWidth = 2.2;
            const paddle = new THREE.Mesh(
                new THREE.BoxGeometry(paddleWidth, .3, .62),
                new THREE.MeshStandardMaterial({ color: '#48f1dc', emissive: '#0aa994', emissiveIntensity: .62, metalness: .3, roughness: .22 })
            );
            paddle.position.set(0, -4.15, .05);
            scene.add(paddle);
            const paddleEdge = new THREE.Mesh(new THREE.BoxGeometry(paddleWidth * .7, .07, .67), new THREE.MeshBasicMaterial({ color: '#efffa9' }));
            paddleEdge.position.set(0, -4.06, .07);
            paddle.add(paddleEdge);

            const ball = new THREE.Mesh(
                new THREE.SphereGeometry(.2, 24, 18),
                new THREE.MeshStandardMaterial({ color: '#fff5cf', emissive: '#ffe76a', emissiveIntensity: 2.3, roughness: .15 })
            );
            const ballGlow = new THREE.PointLight('#fff07a', 3, 3);
            ball.add(ballGlow);
            scene.add(ball);

            const brickColors = ['#d7ff4f', '#48f1dc', '#ffad45', '#ff5a89', '#b9a0ff'];
            const bricks = [];
            const brickGeometry = new THREE.BoxGeometry(1.48, .48, .55);
            const brickWidth = 1.48;
            const brickHeight = .48;
            const columns = 9;
            const rows = 4;
            const gapX = .22;
            const gapY = .22;
            const totalWidth = columns * brickWidth + (columns - 1) * gapX;
            const firstX = -totalWidth / 2 + brickWidth / 2;

            function buildBricks() {
                bricks.splice(0).forEach(brick => scene.remove(brick));
                for (let row = 0; row < rows; row++) {
                    for (let column = 0; column < columns; column++) {
                        const color = brickColors[(row + column) % brickColors.length];
                        const material = new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: .28, metalness: .16, roughness: .28 });
                        const brick = new THREE.Mesh(brickGeometry, material);
                        brick.position.set(firstX + column * (brickWidth + gapX), 3.45 - row * (brickHeight + gapY), .03);
                        brick.userData = { color, row, column };
                        scene.add(brick);
                        bricks.push(brick);
                    }
                }
            }
            buildBricks();

            const particles = [];
            const starsGeometry = new THREE.BufferGeometry();
            const starPositions = new Float32Array(210 * 3);
            for (let i = 0; i < 210; i++) {
                starPositions[i * 3] = (Math.random() - .5) * 34;
                starPositions[i * 3 + 1] = (Math.random() - .5) * 22;
                starPositions[i * 3 + 2] = -4 - Math.random() * 7;
            }
            starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
            const stars = new THREE.Points(starsGeometry, new THREE.PointsMaterial({ color: '#d7ffb2', size: .035, transparent: true, opacity: .65 }));
            scene.add(stars);

            let score = 0;
            let lives = 3;
            let best = Number(localStorage.getItem('neonBreakerBest') || 0);
            let running = false;
            let muted = false;
            let audio;
            let keys = {};
            let ballVelocity = new THREE.Vector2(4.8, 6.5);
            let pointerActive = false;
            let lastTime = 0;
            let animationId = 0;
            bestEl.textContent = String(best).padStart(5, '0');

            function tone(frequency, duration, type = 'sine', volume = .04, endFrequency = frequency) {
                if (muted) return;
                try {
                    audio ||= new (window.AudioContext || window.webkitAudioContext)();
                    if (audio.state === 'suspended') audio.resume();
                    const oscillator = audio.createOscillator();
                    const gain = audio.createGain();
                    oscillator.type = type;
                    oscillator.frequency.setValueAtTime(frequency, audio.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), audio.currentTime + duration);
                    gain.gain.setValueAtTime(volume, audio.currentTime);
                    gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + duration);
                    oscillator.connect(gain);
                    gain.connect(audio.destination);
                    oscillator.start();
                    oscillator.stop(audio.currentTime + duration);
                } catch (_) {}
            }

            function burst(x, y, color) {
                const material = new THREE.MeshBasicMaterial({ color, transparent: true });
                for (let i = 0; i < 9; i++) {
                    const mesh = new THREE.Mesh(new THREE.SphereGeometry(.035 + Math.random() * .045, 6, 6), material.clone());
                    mesh.position.set(x, y, .15);
                    scene.add(mesh);
                    particles.push({ mesh, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: .4 + Math.random() * .3 });
                }
            }

            function updateHud() {
                scoreEl.textContent = String(score).padStart(5, '0');
                livesEl.textContent = '♥'.repeat(lives) + '♡'.repeat(3 - lives);
            }

            function reset() {
                score = 0;
                lives = 3;
                ballVelocity.set(4.8, 6.5);
                ball.position.set(0, -3.55, .22);
                paddle.position.x = 0;
                buildBricks();
                particles.splice(0).forEach(particle => scene.remove(particle.mesh));
                updateHud();
            }

            function showEnd(title, message) {
                running = false;
                document.querySelector('#headline').innerHTML = title;
                document.querySelector('#message').innerHTML = message;
                startButton.textContent = '再玩一次　↗';
                overlay.hidden = false;
                tone(220, .35, 'triangle', .055, 100);
            }

            function startGame() {
                reset();
                overlay.hidden = true;
                running = true;
                lastTime = performance.now();
                tone(440, .16, 'sine', .045, 880);
                cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(loop);
            }

            function pauseGame() {
                if (overlay.hidden && running) {
                    running = false;
                    document.querySelector('#headline').innerHTML = 'GAME<br><span>PAUSED</span>';
                    document.querySelector('#message').innerHTML = '按暫停按鈕或空白鍵，繼續這一局。';
                    startButton.textContent = '繼續遊戲　↗';
                    overlay.hidden = false;
                } else if (!overlay.hidden && document.querySelector('#headline').textContent.includes('PAUSED')) {
                    overlay.hidden = true;
                    running = true;
                    lastTime = performance.now();
                    animationId = requestAnimationFrame(loop);
                }
            }

            function loseLife() {
                lives--;
                updateHud();
                burst(ball.position.x, -4.65, '#ff5a89');
                tone(180, .22, 'sawtooth', .06, 70);
                if (lives <= 0) {
                    showEnd('GAME<br><span>OVER</span>', `最終得分：${score}<br>再來一局，把紀錄留在這裡。`);
                    return;
                }
                ball.position.set(paddle.position.x, -3.55, .22);
                ballVelocity.set((Math.random() - .5) * 4, 6.5);
            }

            function update(dt) {
                const moveLeft = keys.ArrowLeft || keys.a || keys.A;
                const moveRight = keys.ArrowRight || keys.d || keys.D;
                if (moveLeft) paddle.position.x -= 10 * dt;
                if (moveRight) paddle.position.x += 10 * dt;
                paddle.position.x = THREE.MathUtils.clamp(paddle.position.x, -6.8, 6.8);
                paddleEdge.position.x = 0;

                ball.position.x += ballVelocity.x * dt;
                ball.position.y += ballVelocity.y * dt;
                ball.rotation.x += dt * 2;
                ball.rotation.y += dt * 3.2;
                if (ball.position.x < -7.55 || ball.position.x > 7.55) {
                    ball.position.x = THREE.MathUtils.clamp(ball.position.x, -7.55, 7.55);
                    ballVelocity.x *= -1;
                    tone(340, .06, 'sine', .025, 490);
                }
                if (ball.position.y > 4.62) {
                    ball.position.y = 4.62;
                    ballVelocity.y *= -1;
                    tone(340, .06, 'sine', .025, 490);
                }

                const paddleTop = paddle.position.y + .18;
                if (ballVelocity.y < 0 && ball.position.y - .2 <= paddleTop && ball.position.y > paddle.position.y - .38 && Math.abs(ball.position.x - paddle.position.x) < paddleWidth / 2 + .18) {
                    const hit = (ball.position.x - paddle.position.x) / (paddleWidth / 2);
                    ball.position.y = paddleTop + .21;
                    ballVelocity.y = Math.abs(ballVelocity.y);
                    ballVelocity.x = hit * 6.7;
                    tone(460, .09, 'triangle', .035, 720);
                } else if (ball.position.y < -5.15) {
                    loseLife();
                    return;
                }

                for (let i = bricks.length - 1; i >= 0; i--) {
                    const brick = bricks[i];
                    const nearestX = THREE.MathUtils.clamp(ball.position.x, brick.position.x - brickWidth / 2, brick.position.x + brickWidth / 2);
                    const nearestY = THREE.MathUtils.clamp(ball.position.y, brick.position.y - brickHeight / 2, brick.position.y + brickHeight / 2);
                    const dx = ball.position.x - nearestX;
                    const dy = ball.position.y - nearestY;
                    if (dx * dx + dy * dy < .21 * .21) {
                        if (Math.abs(dx) > Math.abs(dy)) ballVelocity.x *= -1;
                        else ballVelocity.y *= -1;
                        burst(brick.position.x, brick.position.y, brick.userData.color);
                        scene.remove(brick);
                        brick.material.dispose();
                        bricks.splice(i, 1);
                        score += 100;
                        updateHud();
                        tone(280 + brick.userData.row * 75, .11, 'square', .035, 520 + brick.userData.column * 24);
                        if (score > best) {
                            best = score;
                            bestEl.textContent = String(best).padStart(5, '0');
                            localStorage.setItem('neonBreakerBest', String(best));
                        }
                        if (!bricks.length) showEnd('ROUND<br><span>CLEARED!</span>', `漂亮！你拿下 ${score} 分。<br>下一輪再把節奏推高一點。`);
                        break;
                    }
                }

                for (let i = particles.length - 1; i >= 0; i--) {
                    const particle = particles[i];
                    particle.mesh.position.x += particle.vx * dt;
                    particle.mesh.position.y += particle.vy * dt;
                    particle.life -= dt;
                    particle.mesh.material.opacity = Math.max(0, particle.life * 1.8);
                    if (particle.life <= 0) {
                        scene.remove(particle.mesh);
                        particle.mesh.geometry.dispose();
                        particle.mesh.material.dispose();
                        particles.splice(i, 1);
                    }
                }
                stars.rotation.z += dt * .003;
            }

            function loop(now) {
                if (running) {
                    const dt = Math.min((now - lastTime) / 1000, .035);
                    lastTime = now;
                    update(dt);
                    renderer.render(scene, camera);
                    if (running) animationId = requestAnimationFrame(loop);
                } else {
                    renderer.render(scene, camera);
                }
            }

            function resize() {
                const rect = canvas.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                renderer.setSize(rect.width, rect.height, false);
                camera.aspect = rect.width / rect.height;
                camera.updateProjectionMatrix();
                renderer.render(scene, camera);
            }

            function movePaddle(event) {
                const rect = canvas.getBoundingClientRect();
                const normalizedX = (event.clientX - rect.left) / rect.width;
                const viewHeight = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.position.z;
                const viewWidth = viewHeight * camera.aspect;
                paddle.position.x = THREE.MathUtils.clamp((normalizedX - .5) * viewWidth, -6.8, 6.8);
                if (!running && score === 0) ball.position.x = paddle.position.x;
            }

            canvas.addEventListener('pointerdown', event => { pointerActive = true; canvas.setPointerCapture(event.pointerId); movePaddle(event); });
            canvas.addEventListener('pointermove', event => { if (pointerActive) movePaddle(event); });
            canvas.addEventListener('pointerup', () => pointerActive = false);
            canvas.addEventListener('pointercancel', () => pointerActive = false);
            addEventListener('keydown', event => {
                keys[event.key] = true;
                if (event.key === ' ' || event.key.startsWith('Arrow')) event.preventDefault();
                if (event.key === ' ' && !overlay.hidden) {
                    if (document.querySelector('#headline').textContent.includes('PAUSED')) pauseGame();
                    else startGame();
                } else if (event.key === ' ' && running) pauseGame();
            });
            addEventListener('keyup', event => keys[event.key] = false);
            startButton.addEventListener('click', () => {
                if (document.querySelector('#headline').textContent.includes('PAUSED')) pauseGame();
                else startGame();
            });
            pauseButton.addEventListener('click', pauseGame);
            soundButton.addEventListener('click', () => {
                muted = !muted;
                soundButton.setAttribute('aria-label', muted ? '開啟音效' : '關閉音效');
                soundButton.innerHTML = muted
                    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 5 6m0-6-5 6"/></svg>'
                    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7m3-10a9 9 0 0 1 0 13"/></svg>';
                if (!muted) tone(660, .09, 'sine', .035, 880);
            });
            addEventListener('resize', resize);
            resize();
            renderer.render(scene, camera);
        })();
    </script>
</body>
</html>
